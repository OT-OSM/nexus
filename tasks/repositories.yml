# ---------------- DOCKER PROXY ----------------
- name: Create Docker Proxy
  uri:
    url: "{{ nexus_url }}/service/rest/v1/repositories/docker/proxy"
    method: POST
    user: admin
    password: "{{ new_admin_password }}"
    force_basic_auth: yes
    body_format: json
    status_code: 201
    body:
      name: "{{ docker_proxy_repo }}"
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
      proxy:
        remoteUrl: "{{ docker_remote_url }}"
        contentMaxAge: 1440
        metadataMaxAge: 1440
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: true
      docker:
        v1Enabled: false
        forceBasicAuth: true
        httpPort: 5000
      dockerProxy:
        indexType: HUB
  when: docker_proxy_repo not in (repo_list.json | map(attribute='name') | list)
