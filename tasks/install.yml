---

- name: Install Java
  become: yes
  apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes

- name: Install required packages
  become: yes
  apt:
    name:
      - wget
      - ca-certificates
    state: present

# ✅ Create Nexus user/group (before ownership)
- name: Create Nexus group
  become: yes
  group:
    name: "{{ nexus_group }}"
    system: yes

- name: Create Nexus user
  become: yes
  user:
    name: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    shell: /bin/bash
    create_home: no
    system: yes

- name: Download Nexus
  become: yes
  get_url:
    url: "{{ nexus_download_url }}"
    dest: "/tmp/nexus.tar.gz"
    mode: '0644'
    timeout: 300
  register: nexus_download
  retries: 3
  delay: 5
  until: nexus_download is succeeded

- name: Check Nexus tar exists
  become: yes
  stat:
    path: "/tmp/nexus.tar.gz"
  register: nexus_tar_stat

- name: Fail if Nexus tar missing
  fail:
    msg: "Nexus tar not downloaded!"
  when: not nexus_tar_stat.stat.exists

# ✅ Extract directly to /opt (NO mv)
- name: Extract Nexus
  become: yes
  unarchive:
    src: "/tmp/nexus.tar.gz"
    dest: "/opt"
    remote_src: yes
    creates: "/opt/nexus-{{ nexus_version }}"

# ✅ Create symlink (/opt/nexus → version dir)
- name: Create Nexus symlink
  become: yes
  file:
    src: "/opt/nexus-{{ nexus_version }}"
    dest: "{{ nexus_install_dir }}"
    state: link

# ✅ Ensure data directory exists
- name: Ensure Nexus data directory
  become: yes
  file:
    path: "{{ nexus_data_dir }}"
    state: directory
    owner: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    mode: '0755'

# ✅ Set ownership
- name: Set ownership
  become: yes
  file:
    path: "{{ item }}"
    owner: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    recurse: yes
  loop:
    - "/opt/nexus-{{ nexus_version }}"
    - "{{ nexus_data_dir }}"

# ✅ Configure Nexus runtime user
- name: Configure nexus.rc
  become: yes
  lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.rc"
    line: 'run_as_user="{{ nexus_user }}"'
    create: yes

# ✅ Fix shell
- name: Fix shell
  become: yes
  replace:
    path: "{{ nexus_install_dir }}/bin/nexus"
    regexp: '^#!/bin/sh'
    replace: '#!/bin/bash'

# ✅ Configure JVM
- name: Configure JVM
  become: yes
  blockinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.vmoptions"
    block: |
      -Xms{{ java_xms }}
      -Xmx{{ java_xmx }}
      -XX:MaxDirectMemorySize={{ java_max_direct }}

# ✅ Create systemd service
- name: Create systemd service
  become: yes
  template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service

# ✅ Reload systemd
- name: Reload systemd
  become: yes
  command: systemctl daemon-reload

# ✅ Enable & Start Nexus
- name: Enable & Start Nexus
  become: yes
  service:
    name: nexus
    state: started
    enabled: yes
