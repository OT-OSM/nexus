- name: Install Java
  apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes

- name: Install required packages
  apt:
    name:
      - wget
      - curl
    state: present

# ✅ Ensure /opt exists
- name: Ensure /opt directory exists
  file:
    path: /opt
    state: directory
    mode: '0755'

# ✅ Download Nexus directly on TARGET (fix for your issue)
- name: Download Nexus
  command: >
    curl -L -o /opt/nexus.tar.gz {{ nexus_download_url }}
  args:
    creates: /opt/nexus.tar.gz

# ✅ Validate download
- name: Check Nexus tar exists
  stat:
    path: /opt/nexus.tar.gz
  register: nexus_tar

- name: Fail if Nexus tar not found
  fail:
    msg: "Nexus tar file not downloaded!"
  when: not nexus_tar.stat.exists

# ✅ Extract Nexus
- name: Extract Nexus
  unarchive:
    src: /opt/nexus.tar.gz
    dest: /opt/
    remote_src: yes

# ✅ Move Nexus directory
- name: Move Nexus
  command: mv /opt/nexus-{{ nexus_version }} {{ nexus_install_dir }}
  args:
    creates: "{{ nexus_install_dir }}"

# ✅ Move sonatype-work
- name: Move sonatype-work
  command: mv /opt/sonatype-work {{ nexus_data_dir }}
  args:
    creates: "{{ nexus_data_dir }}"

# ✅ Create Nexus user
- name: Create Nexus user
  user:
    name: "{{ nexus_user }}"
    shell: /bin/bash
    create_home: yes

# ✅ Ensure group exists
- name: Ensure Nexus group exists
  group:
    name: "{{ nexus_group }}"
    state: present

# ✅ Set ownership
- name: Set ownership
  file:
    path: "{{ item }}"
    owner: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    recurse: yes
  loop:
    - "{{ nexus_install_dir }}"
    - "{{ nexus_data_dir }}"

# ✅ Configure nexus.rc
- name: Configure nexus.rc
  lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.rc"
    line: 'run_as_user="{{ nexus_user }}"'
    create: yes

# ✅ Fix shell
- name: Fix shell
  replace:
    path: "{{ nexus_install_dir }}/bin/nexus"
    regexp: '^#!/bin/sh'
    replace: '#!/bin/bash'

# ✅ Configure JVM
- name: Configure JVM
  blockinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.vmoptions"
    block: |
      -Xms{{ java_xms }}
      -Xmx{{ java_xmx }}
      -XX:MaxDirectMemorySize={{ java_max_direct }}

# ✅ Create systemd service
- name: Create systemd service
  template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service

# ✅ Reload systemd
- name: Reload systemd
  command: systemctl daemon-reload

# ✅ Enable & Start Nexus
- name: Enable & Start Nexus
  service:
    name: nexus
    state: started
    enabled: yes
