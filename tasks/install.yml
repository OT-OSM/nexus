---

- name: Install Java
  become: yes
  apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes

- name: Install required packages
  become: yes
  apt:
    name:
      - wget
      - ca-certificates
    state: present

# ✅ Set base paths
- name: Set Nexus paths
  set_fact:
    nexus_home: "{{ ansible_env.HOME }}"
    nexus_tar: "{{ ansible_env.HOME }}/nexus.tar.gz"
    nexus_extract_dir: "{{ ansible_env.HOME }}/nexus-{{ nexus_version }}"

# ✅ Clean old download
- name: Remove old Nexus tar
  file:
    path: "{{ nexus_tar }}"
    state: absent

# ✅ Download Nexus to HOME
- name: Download Nexus
  get_url:
    url: "{{ nexus_download_url }}"
    dest: "{{ nexus_tar }}"
    mode: '0644'
    timeout: 300
  register: download_result
  retries: 3
  delay: 5
  until: download_result is succeeded

# ✅ Extract in HOME
- name: Extract Nexus
  unarchive:
    src: "{{ nexus_tar }}"
    dest: "{{ nexus_home }}"
    remote_src: yes
    creates: "{{ nexus_extract_dir }}"

# ✅ Move Nexus binaries
- name: Move Nexus to install directory
  command: mv "{{ nexus_extract_dir }}" "{{ nexus_install_dir }}"
  args:
    creates: "{{ nexus_install_dir }}"

# ✅ Move data directory
- name: Move sonatype-work to data directory
  command: mv "{{ nexus_home }}/sonatype-work" "{{ nexus_data_dir }}"
  args:
    creates: "{{ nexus_data_dir }}"

# ✅ Create Nexus user
- name: Create Nexus user
  become: yes
  user:
    name: "{{ nexus_user }}"
    shell: /bin/bash
    create_home: yes

# ✅ Set ownership
- name: Set ownership
  become: yes
  file:
    path: "{{ item }}"
    owner: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    recurse: yes
  loop:
    - "{{ nexus_install_dir }}"
    - "{{ nexus_data_dir }}"

# ✅ Configure Nexus runtime user
- name: Configure nexus.rc
  lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.rc"
    line: 'run_as_user="{{ nexus_user }}"'
    create: yes

# ✅ Fix shell
- name: Fix shell
  replace:
    path: "{{ nexus_install_dir }}/bin/nexus"
    regexp: '^#!/bin/sh'
    replace: '#!/bin/bash'

# ✅ Configure JVM
- name: Configure JVM
  blockinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.vmoptions"
    block: |
      -Xms{{ java_xms }}
      -Xmx{{ java_xmx }}
      -XX:MaxDirectMemorySize={{ java_max_direct }}

# ✅ Create systemd service (still needs root)
- name: Create systemd service
  become: yes
  template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service

# ✅ Reload systemd
- name: Reload systemd
  become: yes
  command: systemctl daemon-reload

# ✅ Enable & Start Nexus
- name: Enable & Start Nexus
  become: yes
  service:
    name: nexus
    state: started
    enabled: yes
