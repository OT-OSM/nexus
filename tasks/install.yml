---
- name: Install Java
  apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes

- name: Install required packages
  apt:
    name:
      - wget
      - ca-certificates
    state: present

# ✅ Clean old download
- name: Remove old Nexus tar
  file:
    path: /opt/nexus.tar.gz
    state: absent

# ✅ Download Nexus
- name: Download Nexus
  become: yes
  get_url:
    url: "{{ nexus_download_url }}"
    dest: "/opt/nexus.tar.gz"
    mode: '0644'
    timeout: 300
  register: download_result
  retries: 3
  delay: 5
  until: download_result is succeeded

# ✅ Extract directly to /opt (NO separate dir)
- name: Extract Nexus
  become: yes
  unarchive:
    src: "/opt/nexus.tar.gz"
    dest: "/opt"
    remote_src: yes
    creates: "/opt/nexus-{{ nexus_version }}"

# ✅ Move Nexus binaries
- name: Move Nexus to install directory
  command: mv /opt/nexus-{{ nexus_version }} {{ nexus_install_dir }}
  args:
    creates: "{{ nexus_install_dir }}"

# ✅ Move data directory
- name: Move sonatype-work to data directory
  command: mv /opt/sonatype-work {{ nexus_data_dir }}
  args:
    creates: "{{ nexus_data_dir }}"

# ✅ Create Nexus user
- name: Create Nexus user
  user:
    name: "{{ nexus_user }}"
    shell: /bin/bash
    create_home: yes

# ✅ Set ownership
- name: Set ownership
  file:
    path: "{{ item }}"
    owner: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    recurse: yes
  loop:
    - "{{ nexus_install_dir }}"
    - "{{ nexus_data_dir }}"

# ✅ Configure Nexus runtime user
- name: Configure nexus.rc
  lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.rc"
    line: 'run_as_user="{{ nexus_user }}"'
    create: yes

# ✅ Fix shell
- name: Fix shell
  replace:
    path: "{{ nexus_install_dir }}/bin/nexus"
    regexp: '^#!/bin/sh'
    replace: '#!/bin/bash'

# ✅ Configure JVM
- name: Configure JVM
  blockinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.vmoptions"
    block: |
      -Xms{{ java_xms }}
      -Xmx{{ java_xmx }}
      -XX:MaxDirectMemorySize={{ java_max_direct }}

# ✅ Create systemd service
- name: Create systemd service
  template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service

# ✅ Reload systemd
- name: Reload systemd
  command: systemctl daemon-reload

# ✅ Enable & Start Nexus
- name: Enable & Start Nexus
  service:
    name: nexus
    state: started
    enabled: yes
