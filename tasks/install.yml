---
- name: Install Java
  apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes

- name: Install required packages
  apt:
    name:
      - wget
      - ca-certificates
    state: present

# :white_check_mark: Use get_url instead of command: wget
# It handles retries, validation, and error reporting much better
- name: Download Nexus
  get_url:
    url: "{{ nexus_download_url }}"
    dest: "/tmp/nexus.tar.gz"
    mode: '0644'
    timeout: 60
  register: download_result
  until: download_result is succeeded
  retries: 3

# This is much safer than manual 'mv' commands
- name: Ensure Nexus extraction directory exists
  file:
    path: "/tmp/nexus-extract"
    state: directory

- name: Extract Nexus
  unarchive:
    src: "/tmp/nexus.tar.gz"
    dest: "/tmp/nexus-extract"
    remote_src: yes
    creates: "/tmp/nexus-extract/nexus-{{ nexus_version }}"

- name: Move Nexus to install directory
  command: "mv /tmp/nexus-extract/nexus-{{ nexus_version }} {{ nexus_install_dir }}"
  args:
    creates: "{{ nexus_install_dir }}"

- name: Move sonatype-work to data directory
  command: "mv /tmp/nexus-extract/sonatype-work {{ nexus_data_dir }}"
  args:
    creates: "{{ nexus_data_dir }}"

- name: Create Nexus user
  user:
    name: "{{ nexus_user }}"

- name: Set ownership
  file:
    path: "{{ item }}"
    owner: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    recurse: yes
  loop:
    - "{{ nexus_install_dir }}"
    - "{{ nexus_data_dir }}"

- name: Configure nexus.rc
  lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.rc"
    line: 'run_as_user="{{ nexus_user }}"'
    create: yes

- name: Fix shell
  replace:
    path: "{{ nexus_install_dir }}/bin/nexus"
    regexp: '^#!/bin/sh'
    replace: '#!/bin/bash'

- name: Configure JVM
  blockinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.vmoptions"
    block: |
      -Xms{{ java_xms }}
      -Xmx{{ java_xmx }}
      -XX:MaxDirectMemorySize={{ java_max_direct }}

- name: Create systemd service
  template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service

- name: Reload systemd
  command: systemctl daemon-reload

- name: Enable & Start Nexus
  service:
    name: nexus
    state: started
    enabled: yes
