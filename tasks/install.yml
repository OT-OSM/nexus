# ---------------- PRE-CHECK ----------------
- name: Check if curl is available
  command: which curl
  register: curl_check
  changed_when: false
  failed_when: curl_check.rc != 0


# ---------------- DIRECTORIES ----------------
- name: Ensure base directory exists
  file:
    path: "{{ nexus_base_dir }}"
    state: directory
    mode: '0755'


# ---------------- DOWNLOAD ----------------
- name: Download Nexus using curl
  command: >
    curl -fL "{{ nexus_download_url }}" -o {{ nexus_tmp_archive }}
  args:
    creates: "{{ nexus_tmp_archive }}"
  environment:
    http_proxy: "{{ http_proxy | default(omit) }}"
    https_proxy: "{{ https_proxy | default(omit) }}"


# ---------------- VALIDATE ----------------
- name: Check Nexus tar exists
  stat:
    path: "{{ nexus_tmp_archive }}"
  register: nexus_tar

- name: Fail if Nexus tar not found
  fail:
    msg: "Nexus tar file not downloaded!"
  when: not nexus_tar.stat.exists


# ---------------- EXTRACT ----------------
- name: Extract Nexus
  unarchive:
    src: "{{ nexus_tmp_archive }}"
    dest: "{{ nexus_base_dir }}/"
    remote_src: yes
    creates: "{{ nexus_base_dir }}/nexus-{{ nexus_version }}"


# ---------------- MOVE DIRECTORIES ----------------
- name: Move Nexus directory
  command: >
    mv {{ nexus_base_dir }}/nexus-{{ nexus_version }} {{ nexus_install_dir }}
  args:
    creates: "{{ nexus_install_dir }}"

- name: Move sonatype-work
  command: >
    mv {{ nexus_base_dir }}/sonatype-work {{ nexus_data_dir }}
  args:
    creates: "{{ nexus_data_dir }}"


# ---------------- USER & GROUP ----------------
- name: Ensure Nexus group exists
  group:
    name: "{{ nexus_group }}"
    state: present

- name: Create Nexus user
  user:
    name: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    shell: "{{ nexus_shell }}"
    create_home: yes


# ---------------- PERMISSIONS ----------------
- name: Set ownership
  file:
    path: "{{ item }}"
    owner: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    recurse: yes
  loop:
    - "{{ nexus_install_dir }}"
    - "{{ nexus_data_dir }}"


# ---------------- CONFIGURATION ----------------
- name: Configure nexus.rc
  lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.rc"
    line: 'run_as_user="{{ nexus_user }}"'
    create: yes

- name: Fix shell (optional)
  replace:
    path: "{{ nexus_install_dir }}/bin/nexus"
    regexp: '^#!/bin/sh'
    replace: '#!{{ nexus_shell }}'
  when: nexus_shell is defined


- name: Configure JVM
  blockinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.vmoptions"
    block: |
      -Xms{{ java_xms }}
      -Xmx{{ java_xmx }}
      -XX:MaxDirectMemorySize={{ java_max_direct }}


# ---------------- SYSTEMD ----------------
- name: Create systemd service
  template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service
  when: ansible_service_mgr == "systemd"
  notify: Reload systemd


- name: Enable & Start Nexus
  service:
    name: nexus
    state: started
    enabled: yes
  when: ansible_service_mgr == "systemd"
