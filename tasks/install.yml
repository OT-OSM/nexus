- name: Install Java
  apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes

- name: Install required packages
  apt:
    name: wget
    state: present

# ===============================
# 🔍 DEBUG: Who am I running as?
# ===============================
- name: Debug current user
  command: whoami
  register: current_user

- debug:
    var: current_user.stdout

# ===============================
# 🔍 DEBUG: Check /opt permissions
# ===============================
- name: Check /opt permissions
  command: ls -ld /opt
  register: opt_perm

- debug:
    var: opt_perm.stdout

# ===============================
# 🔽 Download Nexus
# ===============================
- name: Download Nexus
  get_url:
    url: "{{ nexus_download_url }}"
    dest: "/opt/nexus.tar.gz"
    mode: '0644'
  register: download_output

- name: Show download result
  debug:
    var: download_output

# ===============================
# 🔍 Verify file exists
# ===============================
- name: Check if Nexus tar exists
  stat:
    path: "/opt/nexus.tar.gz"
  register: nexus_tar

- name: Show Nexus tar status
  debug:
    var: nexus_tar

# ===============================
# 🔍 Check file size
# ===============================
- name: Check Nexus file size
  command: ls -lh /opt/nexus.tar.gz
  register: nexus_size
  ignore_errors: yes

- debug:
    var: nexus_size.stdout

# ===============================
# 🔍 List /opt directory
# ===============================
- name: List /opt directory
  command: ls -lh /opt
  register: opt_list

- debug:
    var: opt_list.stdout

# ===============================
# ❌ Fail if file missing
# ===============================
- name: Fail if Nexus tar not found
  fail:
    msg: "Nexus tar file not downloaded!"
  when: not nexus_tar.stat.exists

# ===============================
# 🔄 Extract Nexus
# ===============================
- name: Extract Nexus
  unarchive:
    src: "/opt/nexus.tar.gz"
    dest: "/opt/"
    remote_src: yes
  register: extract_output

- debug:
    var: extract_output

# ===============================
# 🔍 Check extracted folder
# ===============================
- name: Check extracted Nexus directory
  command: ls -lh /opt
  register: extract_check

- debug:
    var: extract_check.stdout

# ===============================
# Move Nexus directory
# ===============================
- name: Move Nexus
  command: mv /opt/nexus-{{ nexus_version }} {{ nexus_install_dir }}
  args:
    creates: "{{ nexus_install_dir }}"

# ===============================
# Move sonatype-work
# ===============================
- name: Move sonatype-work
  command: mv /opt/sonatype-work {{ nexus_data_dir }}
  args:
    creates: "{{ nexus_data_dir }}"

# ===============================
# Create Nexus user
# ===============================
- name: Create Nexus user
  user:
    name: "{{ nexus_user }}"
    shell: /bin/bash
    create_home: yes

# ===============================
# Set ownership
# ===============================
- name: Set ownership
  file:
    path: "{{ item }}"
    owner: "{{ nexus_user }}"
    group: "{{ nexus_group }}"
    recurse: yes
  loop:
    - "{{ nexus_install_dir }}"
    - "{{ nexus_data_dir }}"

# ===============================
# Configure nexus.rc
# ===============================
- name: Configure nexus.rc
  lineinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.rc"
    line: 'run_as_user="{{ nexus_user }}"'
    create: yes

# ===============================
# Fix shell
# ===============================
- name: Fix shell
  replace:
    path: "{{ nexus_install_dir }}/bin/nexus"
    regexp: '^#!/bin/sh'
    replace: '#!/bin/bash'

# ===============================
# Configure JVM
# ===============================
- name: Configure JVM
  blockinfile:
    path: "{{ nexus_install_dir }}/bin/nexus.vmoptions"
    block: |
      -Xms{{ java_xms }}
      -Xmx{{ java_xmx }}
      -XX:MaxDirectMemorySize={{ java_max_direct }}

# ===============================
# Create systemd service
# ===============================
- name: Create systemd service
  template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service

# ===============================
# Reload systemd
# ===============================
- name: Reload systemd
  command: systemctl daemon-reload

# ===============================
# Start Nexus
# ===============================
- name: Enable & Start Nexus
  service:
    name: nexus
    state: started
    enabled: yes
