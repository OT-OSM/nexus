# ---------------- INSTALL DEPENDENCIES ----------------
- name: Install required packages
  package:
    name:
      - nginx
      - openssl
    state: present

# ---------------- SSL DIRECTORY ----------------
- name: Create SSL directory
  file:
    path: /etc/nginx/ssl
    state: directory
    mode: '0755'

# ---------------- SELF-SIGNED CERT ----------------
- name: Generate self-signed certificate
  command: >
    openssl req -x509 -nodes -days 365
    -newkey rsa:2048
    -keyout {{ nexus_tls_key_path }}
    -out {{ nexus_tls_cert_path }}
    -subj "/C={{ nexus_tls_country }}/ST={{ nexus_tls_state }}/L={{ nexus_tls_city }}/O={{ nexus_tls_org }}/CN={{ nexus_tls_common_name }}"
  args:
    creates: "{{ nexus_tls_cert_path }}"
  when: nexus_tls_mode == "self_signed"

# ---------------- PROVIDED CERTS ----------------
- name: Copy TLS certificate
  copy:
    src: "{{ nexus_tls_cert_src }}"
    dest: "{{ nexus_tls_cert_path }}"
    mode: '0644'
  when: nexus_tls_mode == "provided"

- name: Copy TLS key
  copy:
    src: "{{ nexus_tls_key_src }}"
    dest: "{{ nexus_tls_key_path }}"
    mode: '0600'
  when: nexus_tls_mode == "provided"

# ---------------- NGINX CONFIG ----------------
- name: Configure NGINX for Nexus TLS
  template:
    src: nginx-nexus.conf.j2
    dest: /etc/nginx/conf.d/nexus.conf
  notify: Restart nginx

# ---------------- START NGINX ----------------
- name: Enable and start nginx
  service:
    name: nginx
    state: started
    enabled: yes
