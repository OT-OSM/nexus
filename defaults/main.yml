java_package: "openjdk-17-jdk"

nexus_version: "3.78.2-04"
nexus_download_url: "https://download.sonatype.com/nexus/3/nexus-unix-x86-64-{{ nexus_version }}.tar.gz"

nexus_install_dir: "/opt/nexus"
nexus_data_dir: "/opt/sonatype-work"

nexus_user: "nexus"
nexus_group: "nexus"

nexus_port: 8081

java_xms: "1g"
java_xmx: "1g"
java_max_direct: "1g"

# Nexus Access
nexus_url: "{{ nexus_url | default('http://localhost:8081') }}"
nexus_admin_user: "admin"
new_admin_password: "{{ lookup('env', 'NEXUS_ADMIN_PASSWORD') }}"


# BuildPiper User
bp_user: "bp-user"
bp_password: "{{ lookup('env', 'BP_PASSWORD') }}"

# Repositories
maven_proxy_repo: "maven-central"
npm_proxy_repo: "npm-proxy"
docker_proxy_repo: "docker-proxy"
